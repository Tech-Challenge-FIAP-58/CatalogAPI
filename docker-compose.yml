services:
  # O coração da sua busca
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: catalog-elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Desativa login/senha para facilitar o teste da pós
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - catalog-network

  # Interface visual para você ver se os games foram indexados
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: catalog-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - catalog-network

networks:
  catalog-network:
    driver: bridge